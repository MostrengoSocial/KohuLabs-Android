# Checks every pull request and every push to main. Cloudflare deploys the Worker separately (Workers Builds);
# this makes sure what it deploys has been tested. The Android app is built and kept as an artifact.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Worker (sign-in, sync) and database schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test api/test.mjs
      - name: Phone and cloud database schemas match
        run: node db/check-schema.mjs

  web:
    name: Screens (browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 14

  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the Worker locally, for the end-to-end sync test
        run: node ../api/dev-server.mjs 8799 &
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
        env:
          KOHU_E2E_URL: http://127.0.0.1:8799
      - name: Keep the APK to install on a phone
        uses: actions/upload-artifact@v4
        with:
          name: kohu-founders-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
