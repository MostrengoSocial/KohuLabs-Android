<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#090b11">
<title>Kō</title>
<meta name="description" content="Kō plans the day in 25 minute chunks for the Kohu Labs founder.">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
<link rel="preload" href="../assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="founders.css">
</head>
<body>
<main id="app" class="kf-app" aria-label="Kō"></main>
<noscript><p class="kf-noscript">Kō needs JavaScript.</p></noscript>

<!-- The app's screens, from the Claude Design file "Ko Phone" (Kohu Founders App). founders.js fills in the
     {{ values }}, <sc-if> shows its content when the value is true, <sc-for> repeats it for each item, and
     <x-import> places a Kohu UI component (Kō, the stage bar, a KPI tile). See dc.js. -->
<template id="ko-phone">
  <div class="kf-bezel">
  <div data-theme="dark" class="k-root kf-screen">
    <div class="kf-status" aria-hidden="true" style="flex:none;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font:500 13px var(--font-sans);position:relative">
      <span>9:41</span>
      <i style="position:absolute;left:50%;top:10px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#05060a;box-shadow:0 0 0 1px rgba(255,255,255,0.08)"></i>
      <span style="display:flex;align-items:center;gap:8px"><span class="k-mono" style="font-size:10px">5G</span><span style="width:22px;height:11px;border:1px solid var(--ink);border-radius:3px;padding:1px;box-sizing:border-box;display:flex"><i style="width:70%;background:var(--ink);border-radius:1px"></i></span></span>
    </div>

    <sc-if value="{{ pullShow }}">
      <div class="kf-pull" role="status" style="transform:translate(-50%, {{ pullY }});border-color:{{ pullBorder }}"><span class="kf-pull-eyes {{ pullClass }}"><i></i><i></i></span>{{ pullText }}</div>
    </sc-if>
    <div class="kf-scroll" style="flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;position:relative">

      <sc-if value="{{ isOnboarding }}">
        <div style="min-height:100%;display:flex;flex-direction:column;padding:12px 22px 22px;box-sizing:border-box;gap:22px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="k-mono" style="color:var(--muted)"><span style="color:var(--accent)">{{ stepNum }}</span> / 03</span>
            <button class="k-lang" onClick="{{ toggleLang }}" style="background:none;font:inherit;cursor:pointer;min-height:36px;min-width:44px">{{ otherLang }}</button>
          </div>
          <sc-if value="{{ isStep0 }}">
            <div style="flex:1;display:flex;flex-direction:column;gap:22px">
              <div style="display:flex;justify-content:center;margin-top:10px">
                <x-import component-from-global-scope="KohuUI.Signal" size="{{ 250 }}" theme="dark" mood="happy"></x-import>
              </div>
              <div class="k-mono" style="display:flex;align-items:center;gap:10px;color:var(--muted)"><i class="k-status-dot"></i>Kohu Labs · Kō</div>
              <h1 style="margin:0;font-size:48px;font-weight:800;line-height:0.9;letter-spacing:-0.045em;text-wrap:balance">{{ t.welA }} <span style="color:var(--accent)">{{ t.welB }}</span></h1>
              <p style="margin:0;color:var(--muted);font-size:16px;line-height:1.5;text-wrap:pretty">{{ t.welBody }}</p>
              <div style="flex:1"></div>
              <span class="k-mono" style="color:var(--muted);font-size:10px;line-height:1.6;text-transform:none;letter-spacing:0.04em;margin-bottom:-8px">{{ t.oauthNote }}</span>
              <button class="k-btn k-btn-primary" onClick="{{ startOAuth }}" style="width:100%">{{ t.signIn }}<svg class="k-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12L12 4M5 4h7v7"></path></svg></button>
            </div>
          </sc-if>
          <sc-if value="{{ isStep1 }}">
            <div style="flex:1;display:flex;flex-direction:column;gap:20px">
              <h1 style="margin:28px 0 0;font-size:48px;font-weight:800;line-height:0.9;letter-spacing:-0.045em">{{ t.conA }} <span style="color:var(--accent)">{{ t.conB }}</span></h1>
              <p style="margin:0;color:var(--muted);font-size:16px;line-height:1.5;text-wrap:pretty">{{ t.conBody }}</p>
              <div style="display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--radius-sharp);background:var(--surface)">
                <span class="k-mono" style="flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sharp);color:var(--accent)">JD</span>
                <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:15px">João Duarte</div><div style="color:var(--muted);font:400 12px var(--font-mono)">hello@kohulabs.com</div></div>
                <span class="k-pill k-pill-live"><i></i>{{ t.signedIn }}</span>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--radius-sharp);padding:3px;gap:3px">
                <sc-for list="{{ providerOpts }}" as="p">
                  <button onClick="{{ p.onClick }}" style="min-height:52px;padding:8px 10px;border:0;border-radius:var(--radius-sharp);background:{{ p.bg }};color:{{ p.color }};cursor:pointer;text-align:left;display:grid;gap:3px"><span style="font:600 14px var(--font-sans)">{{ p.label }}</span><span style="font:400 10px var(--font-mono);letter-spacing:0.06em;text-transform:uppercase;opacity:0.75">{{ p.sub }}</span></button>
                </sc-for>
              </div>
              <sc-if value="{{ localNotConnected }}">
                <span style="color:var(--muted);font-size:14px;line-height:1.45">{{ t.localPitch }}</span>
                <button class="k-btn k-btn-primary" onClick="{{ startLocal }}" style="width:100%">{{ t.pairBtn }}<svg class="k-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12L12 4M5 4h7v7"></path></svg></button>
              </sc-if>
              <sc-if value="{{ localConnected }}">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)"><span style="display:grid;gap:3px"><span style="font-weight:600">{{ localHost.name }}</span><span class="k-mono" style="color:var(--muted);font-size:10px">{{ localHost.meta }}</span></span><span class="k-pill k-pill-live"><i></i>{{ t.connected }}</span></div>
                <div style="display:grid;gap:8px">
                  <span class="k-mono" style="color:var(--muted)">{{ t.localModels }}</span>
                  <sc-for list="{{ localModels }}" as="m">
                    <button onClick="{{ m.onClick }}" style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;background:var(--surface);border:1px solid {{ m.border }};border-radius:var(--radius-sharp);color:var(--ink);font:400 13px var(--font-mono);cursor:pointer;text-align:left">
                      <span>{{ m.name }}</span><span style="display:flex;align-items:center;gap:10px"><span style="color:var(--muted);font-size:10px">{{ m.size }}</span><i style="width:12px;height:12px;border-radius:50%;border:1px solid {{ m.border }};background:{{ m.dot }}"></i></span>
                    </button>
                  </sc-for>
                </div>
                <span class="k-mono" style="color:var(--muted);font-size:10px;line-height:1.6;text-transform:none;letter-spacing:0.04em">{{ t.localFallback }}</span>
              </sc-if>
              <sc-if value="{{ orNotConnected }}">
                <button class="k-btn k-btn-primary" onClick="{{ startOR }}" style="width:100%">{{ t.connectOR }}<svg class="k-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12L12 4M5 4h7v7"></path></svg></button>
              </sc-if>
              <sc-if value="{{ orConnected }}">
              <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)"><span style="font-weight:600">OpenRouter</span><span style="display:flex;align-items:center;gap:10px"><span class="k-mono" style="color:var(--muted);font-size:10px">{{ capLabel }} {{ t.perMonth }}</span><span class="k-pill k-pill-live"><i></i>{{ t.connected }}</span></span></div>
              <div style="display:grid;gap:8px">
                <span class="k-mono" style="color:var(--muted)">{{ t.modelLabel }}</span>
                <sc-for list="{{ models }}" as="m">
                  <button onClick="{{ m.onClick }}" style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--surface);border:1px solid {{ m.border }};border-radius:var(--radius-sharp);color:var(--ink);font:400 13px var(--font-mono);cursor:pointer;text-align:left">
                    <span>{{ m.name }}</span>
                    <i style="width:12px;height:12px;border-radius:50%;border:1px solid {{ m.border }};background:{{ m.dot }}"></i>
                  </button>
                </sc-for>
              </div>
              </sc-if>
              <div style="flex:1"></div>
              <sc-if value="{{ brainReady }}"><button class="k-btn k-btn-primary" onClick="{{ nextStep }}" style="width:100%">{{ t.cont }}<svg class="k-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12L12 4M5 4h7v7"></path></svg></button></sc-if>
            </div>
          </sc-if>
          <sc-if value="{{ isStep2 }}">
            <div style="flex:1;display:flex;flex-direction:column;gap:20px">
              <h1 style="margin:28px 0 0;font-size:48px;font-weight:800;line-height:0.9;letter-spacing:-0.045em">{{ t.wakA }} <span style="color:var(--accent)">{{ t.wakB }}</span></h1>
              <p style="margin:0;color:var(--muted);font-size:16px;line-height:1.5;text-wrap:pretty">{{ t.wakBody }}</p>
              <div style="display:grid;gap:8px">
                <span class="k-mono" style="color:var(--muted)">{{ t.wakePhrase }}</span>
                <div style="display:flex;gap:6px">
                  <sc-for list="{{ wakeOpts }}" as="w">
                    <button class="{{ w.cls }}" onClick="{{ w.onClick }}" style="padding:10px 16px;font-size:15px">{{ w.label }}</button>
                  </sc-for>
                </div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)">
                <span style="font-weight:600">{{ t.lock }}</span>
                <button onClick="{{ toggleLock }}" aria-label="toggle" style="width:46px;height:26px;border-radius:var(--radius-pill);border:1px solid {{ lockBorder }};background:{{ lockBg }};position:relative;padding:0;cursor:pointer"><i style="position:absolute;top:3px;left:{{ lockKnob }};width:18px;height:18px;border-radius:50%;background:{{ lockDot }};transition:left 0.2s ease"></i></button>
              </div>
              <div style="flex:1"></div>
              <button class="k-btn k-btn-primary" onClick="{{ finishOnboarding }}" style="width:100%">{{ t.finish }}<svg class="k-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12L12 4M5 4h7v7"></path></svg></button>
            </div>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{ showTopBar }}">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 22px 0">
          <span class="k-mono" style="display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden"><i class="k-status-dot"></i>{{ t.date }}</span>
          <button class="k-lang" onClick="{{ toggleLang }}" style="flex:none;background:none;font:inherit;cursor:pointer;min-height:36px;min-width:44px">{{ otherLang }}</button>
        </div>
        <sc-if value="{{ showTabs }}">
        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin:10px 22px 0;padding:3px;border:1px solid var(--line);border-radius:var(--radius-sharp)">
          <sc-for list="{{ modeOpts }}" as="m"><button onClick="{{ m.onClick }}" style="min-height:40px;padding:0 4px;border:0;border-radius:var(--radius-sharp);background:{{ m.bg }};color:{{ m.color }};font:600 13px var(--font-sans);cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px"><i style="flex:none;width:6px;height:6px;border-radius:50%;background:{{ m.dot }}"></i>{{ m.label }}</button></sc-for>
        </div>
        </sc-if>
      </sc-if>

      <sc-if value="{{ isHomeKo }}">
        <div ref="{{ stageRef }}" style="position:absolute;left:0;right:0;top:50px;bottom:0;overflow:hidden">
          <div ref="{{ koRef }}" onClick="{{ toggleHome }}" style="position:absolute;left:0;top:0;width:200px;height:200px;z-index:2;cursor:pointer;will-change:transform">
            <x-import component-from-global-scope="KohuUI.Signal" size="{{ 200 }}" theme="dark" mood="{{ homeMood }}" state="{{ homeState }}"></x-import>
          </div>
          <sc-if value="{{ homeClosed }}">
            <sc-if value="{{ homeNote }}"><button class="kf-note" onClick="{{ openNote }}">{{ homeNote }}</button></sc-if>
            <span class="k-mono" style="position:absolute;left:0;right:0;bottom:18px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:10px"><i style="width:6px;height:6px;border-radius:50%;background:{{ behDot }}"></i>{{ behLabel }} · {{ t.tapKo }}</span>
          </sc-if>
          <sc-if value="{{ homeIsOpen }}">
            <div style="position:absolute;left:22px;right:22px;top:200px;bottom:0;overflow-y:auto;scrollbar-width:none;display:grid;align-content:start;gap:14px;padding-bottom:16px;opacity:{{ tilesOp }};transform:translateY({{ tilesY }});transition:opacity 0.35s ease, transform 0.35s ease">
              <sc-if value="{{ hasNow }}">
                <div style="display:grid;gap:6px;justify-items:center;text-align:center">
                  <span class="k-mono" style="display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10px"><i style="width:7px;height:7px;border-radius:50%;background:var(--acid)"></i>{{ t.now }} · {{ now.task }}</span>
                  <span style="font-size:22px;font-weight:800;letter-spacing:-0.03em;line-height:1.05;text-wrap:balance">{{ now.title }}</span>
                </div>
              </sc-if>
              <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:3px;border:1px solid var(--line);border-radius:var(--radius-sharp)">
                <sc-for list="{{ modeOpts }}" as="m"><button onClick="{{ m.onClick }}" style="min-height:40px;padding:0 4px;border:0;border-radius:var(--radius-sharp);background:{{ m.bg }};color:{{ m.color }};font:600 13px var(--font-sans);cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px"><i style="flex:none;width:6px;height:6px;border-radius:50%;background:{{ m.dot }}"></i>{{ m.label }}</button></sc-for>
              </div>
              <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
                <sc-for list="{{ homeTiles }}" as="b">
                  <button onClick="{{ b.onClick }}" style="display:grid;gap:6px;align-content:space-between;min-height:76px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sharp);color:var(--ink);cursor:pointer;text-align:left;transition:border-color 0.2s ease" style-hover="border-color:var(--accent)">
                    <span style="font:600 16px var(--font-sans);letter-spacing:-0.01em">{{ b.label }}</span>
                    <span class="k-mono" style="color:var(--muted);font-size:10px">{{ b.meta }}</span>
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{ isHomeTimeline }}">
        <div style="padding:22px 22px 28px;display:grid;gap:22px;grid-template-columns:minmax(0,1fr)">
          <sc-if value="{{ showHomeBack }}"><button onClick="{{ backToKo }}" class="k-mono" style="justify-self:start;align-self:flex-start;white-space:nowrap;background:none;border:1px solid var(--line);border-radius:var(--radius-sharp);color:var(--ink);padding:9px 12px;cursor:pointer">‹ Kō</button></sc-if>
          <h1 style="margin:0;font-size:42px;font-weight:800;line-height:0.9;letter-spacing:-0.045em">{{ leftA }} <span style="color:var(--accent)">{{ t.leftB }}</span></h1>
          <sc-if value="{{ showSynced }}">
            <button onClick="{{ openTools }}" class="k-mono" style="margin-top:-8px;justify-self:start;background:none;border:0;padding:0;color:var(--muted);font-size:10px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;line-height:1.5"><i style="flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent)"></i>{{ syncedText }}</button>
          </sc-if>
          <sc-if value="{{ canFeed }}">
            <div style="display:grid;gap:10px;grid-template-columns:minmax(0,1fr);padding:14px;border:1px solid var(--line);border-radius:var(--radius-sharp);background:var(--surface)">
              <span class="k-mono" style="display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap"><i style="flex:none;width:7px;height:7px;border-radius:50%;background:var(--acid)"></i>{{ t.feedLabel }}</span>
              <div style="display:flex;gap:6px">
                <input value="{{ feedInput }}" onChange="{{ onFeedInput }}" onKeyDown="{{ onFeedKey }}" placeholder="{{ t.feedPh }}" style="flex:1;min-width:0;width:0;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius-sharp);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;outline:none">
                <sc-if value="{{ showMic }}"><button onClick="{{ feedMic }}" class="k-mono" style="flex:none;padding:0 10px;border:1px solid {{ feedMicBorder }};border-radius:var(--radius-sharp);background:{{ feedMicBg }};color:{{ feedMicColor }};cursor:pointer">{{ t.mic }}</button></sc-if>
                <button onClick="{{ addFeed }}" style="flex:none;padding:0 14px;border:0;border-radius:var(--radius-sharp);background:var(--accent);color:var(--accent-ink);font:600 14px var(--font-sans);cursor:pointer">{{ t.add }}</button>
              </div>
              <sc-if value="{{ isGeneral }}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="k-mono" style="color:var(--muted);font-size:10px">{{ t.goesTo }}</span><div style="display:flex;gap:4px"><sc-for list="{{ feedTargets }}" as="o"><button class="{{ o.cls }}" onClick="{{ o.onClick }}" style="white-space:nowrap">{{ o.label }}</button></sc-for></div></div></sc-if>
              <span style="font-size:13px;color:var(--muted);line-height:1.4;text-wrap:pretty">{{ feedNote }}</span>
            </div>
          </sc-if>
          <sc-if value="{{ hasNow }}">
            <div style="background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius-sharp);padding:18px;display:grid;gap:16px">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
                <span class="k-mono" style="display:flex;align-items:center;gap:8px"><i style="width:8px;height:8px;border-radius:50%;background:var(--acid)"></i>{{ t.now }} · {{ now.min }} min</span>
                <span class="k-mono" style="color:var(--muted)">{{ now.task }}</span>
              </div>
              <div onClick="{{ now.onClick }}" style="font-size:26px;font-weight:800;line-height:1;letter-spacing:-0.03em;cursor:{{ now.cursor }}">{{ now.title }}</div>
              <div style="display:grid;gap:8px">
                <div style="height:3px;background:var(--line)"><div style="height:3px;width:{{ progress }};background:var(--accent);transition:width 1s linear"></div></div>
                <div style="display:flex;justify-content:space-between" class="k-mono"><span style="color:var(--muted)">{{ elapsedLabel }}</span><span>{{ remaining }}</span></div>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                <button class="k-btn k-btn-primary k-btn-sm" onClick="{{ markDone }}" style="justify-content:center">{{ t.done }}</button>
                <button class="k-btn k-btn-ghost k-btn-sm" onClick="{{ splitNow }}" style="justify-content:center">{{ t.split }}</button>
              </div>
              <sc-if value="{{ demo }}"><button onClick="{{ openGuard }}" style="display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px;padding:10px 0 0;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;text-align:left"><span class="k-mono" style="display:flex;align-items:center;gap:8px;font-size:10px"><i style="flex:none;width:7px;height:7px;border-radius:50%;background:{{ guardDot }}"></i>{{ guardLine }}</span><span style="color:var(--accent)">›</span></button></sc-if>
            </div>
          </sc-if>
          <sc-if value="{{ dayDone }}">
            <div style="border:1px solid var(--line);border-radius:var(--radius-sharp);padding:22px;display:grid;gap:6px"><b style="font-size:22px">{{ t.dayA }}</b><span style="color:var(--muted)">{{ t.dayB }}</span></div>
          </sc-if>
          <div>
            <div class="k-mono" style="display:flex;justify-content:space-between;color:var(--muted);margin-bottom:6px"><span>{{ t.goalsLabel }}</span><span style="color:var(--accent)">{{ goalsCount }}</span></div>
            <sc-for list="{{ goals }}" as="g">
              <button onClick="{{ g.onClick }}" style="width:100%;display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);cursor:pointer;text-align:left;font:inherit">
                <span style="width:18px;height:18px;border-radius:var(--radius-sharp);border:1px solid var(--accent);background:{{ g.bg }};color:var(--accent-ink);font-size:12px;line-height:18px;text-align:center">{{ g.check }}</span>
                <span style="font-weight:600;font-size:15px;line-height:1.25;color:{{ g.color }};text-decoration:{{ g.deco }}">{{ g.label }}</span>
                <span class="k-mono" style="color:var(--muted);font-size:10px">{{ g.ws }}</span>
              </button>
            </sc-for>
          </div>
          <div>
            <div class="k-mono" style="color:var(--muted);margin-bottom:6px">{{ t.later }}</div>
            <sc-for list="{{ others }}" as="c">

            <button class="k-btn k-btn-ghost" onClick="{{ askResplit }}" style="width:100%">{{ t.resplit }}</button>

      <sc-if value="{{ showStatsTabs }}">

            <div style="display:flex;height:10px;gap:2px"><sc-for list="{{ tokRows }}" as="k"><i style="height:10px;width:{{ k.w }};background:{{ k.color }};border-radius:1px"></i></sc-for></div>

              </sc-for>
            </div>
          </div>
          <div style="border:1px solid var(--line);border-radius:var(--radius-sharp);padding:16px;display:grid;gap:10px">

            <span style="font-size:16px;line-height:1.45;text-wrap:pretty">{{ t.insight }}</span>

                </sc-for>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)"><span style="font-weight:600;font-size:14px">{{ t.tlPerm }}</span><div style="display:flex;gap:4px"><sc-for list="{{ newPermOpts }}" as="o"><button class="{{ o.cls }}" onClick="{{ o.onClick }}" style="white-space:nowrap">{{ o.label }}</button></sc-for></div></div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                <button class="k-btn k-btn-ghost k-btn-sm" onClick="{{ cancelSheet }}" style="justify-content:center">{{ t.cancel }}</button>
                <button class="k-btn k-btn-primary k-btn-sm" onClick="{{ connectMcp }}" style="justify-content:center">{{ t.connect }}</button>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ sheetLoading }}">
            <div style="padding:40px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:14px">
              <span class="k-mono" style="display:flex;align-items:center;gap:10px"><i class="k-status-dot"></i>{{ sheetLoadingLabel }}</span>
              <span style="color:var(--muted);font:400 11px var(--font-mono)">{{ sheetLoadingMeta }}</span>
            </div>
          </sc-if>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ isWake }}">
      <div style="position:absolute;top:var(--kf-top);left:0;right:0;bottom:var(--kf-bottom);z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:28px 20px 12px;box-sizing:border-box;gap:14px">
        <div style="display:grid;gap:6px;justify-items:center;opacity:{{ wakeDim }};transition:opacity 0.3s ease">
          <div style="font-size:92px;font-weight:800;letter-spacing:-0.06em;line-height:0.85;font-variant-numeric:tabular-nums">9:41</div>
          <span class="k-mono" style="color:var(--muted)">{{ t.lockDate }}</span>
        </div>
        <sc-if value="{{ wakeAsleep }}"><div style="display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sharp);margin-top:12px">
          <span style="flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:5px"><i style="width:4px;height:4px;border-radius:50%;background:var(--acid)"></i><i style="width:4px;height:4px;border-radius:50%;background:var(--acid)"></i></span>
          <div style="flex:1;min-width:0"><div class="k-mono" style="color:var(--muted);font-size:10px">{{ t.now }} · {{ now.task }}</div><div style="font-weight:600;font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ now.title }}</div></div>
          <span class="k-mono" style="flex:none">{{ remainingClock }}</span>
        </div></sc-if>
        <div style="flex:1"></div>
        <sc-if value="{{ wakeAsleep }}">
          <div style="display:grid;gap:14px;justify-items:center;padding-bottom:8px">
            <span class="k-mono" style="display:flex;align-items:center;gap:8px;color:var(--muted)"><i style="width:7px;height:7px;border-radius:50%;background:var(--acid)"></i>{{ t.wListening }}</span>
            <button class="k-btn k-btn-ghost" onClick="{{ wakeUp }}" style="width:100%;justify-content:center">{{ t.wSimulate }}</button>
            <button onClick="{{ exitWake }}" class="k-mono" style="background:none;border:0;color:var(--muted);cursor:pointer;min-height:44px">{{ t.wUnlock }}</button>
          </div>
        </sc-if>
        <sc-if value="{{ wakeAwake }}">
          <div style="display:grid;gap:14px;padding:18px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius-sharp)">
            <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
              <div style="position:relative;z-index:6"><x-import component-from-global-scope="KohuUI.Signal" size="{{ 170 }}" theme="dark" mood="happy" state="{{ wakeSignal }}"></x-import></div>
              <div style="display:grid;gap:4px;justify-items:center"><span class="k-mono" style="display:flex;align-items:center;gap:8px"><i style="width:8px;height:8px;border-radius:50%;background:{{ wakeDot }}"></i>{{ wakeStatus }}</span><span class="k-mono" style="color:var(--muted);font-size:10px">{{ t.wOnDevice }}</span></div>
            </div>
            <div style="font-size:22px;font-weight:700;line-height:1.15;letter-spacing:-0.02em;min-height:52px;text-align:center">{{ wakeHeard }}<span style="color:var(--accent)">{{ wakeCaret }}</span></div>
            <sc-if value="{{ wakeAnswered }}">
              <div style="display:grid;gap:12px;padding-top:12px;border-top:1px solid var(--line)">
                <span style="font-size:15px;line-height:1.45;text-wrap:pretty">{{ t.wAnswer }}</span>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                  <button class="k-btn k-btn-ghost k-btn-sm" onClick="{{ exitWake }}" style="justify-content:center">{{ t.wOpen }}</button>
                  <button class="k-btn k-btn-primary k-btn-sm" onClick="{{ sleepKo }}" style="justify-content:center">{{ t.wStart }}</button>
                </div>
              </div>
            </sc-if>
          </div>
        </sc-if>
      </div>
    </sc-if>
    <sc-if value="{{ isRing }}">
      <div style="position:absolute;top:var(--kf-top);left:0;right:0;bottom:var(--kf-bottom);z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:28px 20px 12px;box-sizing:border-box;gap:14px">
        <sc-if value="{{ ringOn }}">
          <div style="display:grid;gap:8px;justify-items:center;margin-top:12px">
            <span class="k-mono" style="display:flex;align-items:center;gap:8px"><i style="width:8px;height:8px;border-radius:50%;background:var(--acid)"></i>{{ t.alarm }} · {{ ringLabel }}</span>
            <div style="font-size:112px;font-weight:800;letter-spacing:-0.06em;line-height:0.85;font-variant-numeric:tabular-nums">{{ ringTime }}</div>
            <span class="k-mono" style="color:var(--muted)">{{ t.ringDate }}</span>
          </div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="KohuUI.Signal" size="{{ 200 }}" theme="dark" mood="happy" state="speaking"></x-import></div>
          <span class="k-mono" style="color:var(--muted);text-align:center;font-size:10px">{{ ringNote }}</span>
          <div style="display:grid;gap:8px">
            <button class="k-btn k-btn-primary" onClick="{{ ringUp }}" style="width:100%;justify-content:center">{{ t.ringUp }}</button>
            <button class="k-btn k-btn-ghost" onClick="{{ ringSnooze }}" style="width:100%;justify-content:center">{{ t.ringSnooze }}</button>
          </div>
        </sc-if>
        <sc-if value="{{ ringBrief }}">
          <div style="display:grid;gap:6px;justify-items:center">
            <div style="font-size:64px;font-weight:800;letter-spacing:-0.06em;line-height:0.85;font-variant-numeric:tabular-nums">{{ ringTimeAfter }}</div>
            <span class="k-mono" style="color:var(--muted)">{{ t.ringDate }}</span>
          </div>
          <div style="display:grid;gap:14px;padding:18px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius-sharp);margin-top:6px">
            <span class="k-mono" style="display:flex;align-items:center;gap:8px"><i style="width:8px;height:8px;border-radius:50%;background:var(--acid)"></i>{{ t.briefTitle }} · {{ modeLabel }}</span>
            <span style="font-size:20px;font-weight:700;line-height:1.2;letter-spacing:-0.02em;text-wrap:pretty">{{ briefText }}</span>
            <div>
              <sc-for list="{{ briefItems }}" as="b">
                <div style="display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)"><span class="k-mono" style="color:var(--muted);font-size:10px">{{ b.k }}</span><span style="font-weight:600;font-size:14px;line-height:1.3">{{ b.v }}</span></div>
              </sc-for>
            </div>
          </div>
          <div style="flex:1"></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <button class="k-btn k-btn-ghost k-btn-sm" onClick="{{ ringToKo }}" style="justify-content:center">{{ t.wOpen }}</button>
            <button class="k-btn k-btn-primary k-btn-sm" onClick="{{ ringToToday }}" style="justify-content:center">{{ t.ringToday }}</button>
          </div>
        </sc-if>
      </div>
    </sc-if>
    <div class="kf-homebar" aria-hidden="true" style="flex:none;height:20px;display:flex;align-items:center;justify-content:center"><i style="width:108px;height:4px;border-radius:99px;background:var(--ink);opacity:0.55"></i></div>
  </div>
  </div>
</template>

<script src="../js/signal.js"></script>
<script src="dc.js"></script>
<script src="founders.js"></script>
</body>
</html>
